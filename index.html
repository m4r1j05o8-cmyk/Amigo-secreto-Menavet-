
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Secreto Menavet 2026</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f5f6;
 color:#333;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 padding:20px;
}
.card{
 background:white;
 width:100%;
 max-width:420px;
 padding:30px 24px;
 border-radius:20px;
 text-align:center;
 box-shadow:0 8px 30px #0001;
}
.logo{
 color:#c62828;
 font-size:35px;
 font-weight:bold;
 letter-spacing:2px;
}
.subtitle{color:#777;font-size:13px}
h1{color:#b51f2b;font-size:25px;margin-top:25px}
.gift{font-size:55px;margin:15px}
.info{
 background:#f9eeee;
 padding:15px;
 border-radius:12px;
 margin:20px 0;
 line-height:1.8;
}
label{display:block;text-align:left;margin:15px 0 6px;font-weight:bold}
input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:16px;
}
button{
 width:100%;
 padding:15px;
 margin-top:20px;
 border:0;
 border-radius:9px;
 background:#b51f2b;
 color:white;
 font-size:16px;
 font-weight:bold;
}
.footer{font-size:12px;color:#888;margin-top:25px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">MENAVET</div>
 <div class="subtitle">COSTA RICA</div>

 <div class="gift">🎄🎁</div>

 <h1>Amigo Secreto 2026</h1>
 <p>¡La magia de regalar comienza aquí!</p>

 <div class="info">
  <strong>🎁 Regalo:</strong> ₡10.000<br>
  <strong>📅 Entrega:</strong> 18 de diciembre<br>
  <strong>👥 Participantes:</strong> 12
 </div>

 <h3>Ingreso de participantes</h3>

 <label for="nombre">Tu nombre</label>
 <input id="nombre" placeholder="Escribe tu nombre">

 <label for="pin">Tu PIN personal</label>
 <input id="pin" type="password" placeholder="Ingresa tu PIN">

 <button type="button" onclick="alert('El acceso estará disponible cuando configuremos el sorteo privado.')">
  INGRESAR
 </button>

 <div class="footer">
  Menavet Costa Rica · Amigo Secreto 2026
 </div>
</div>
</body>
</html>
