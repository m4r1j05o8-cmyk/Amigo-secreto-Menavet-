
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigo Secreto Menavet 2026</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:#f4f5f6;
 color:#333;display:flex;justify-content:center;
 align-items:center;min-height:100vh;padding:20px;
}
.card{
 background:white;width:100%;max-width:420px;
 padding:30px 24px;border-radius:20px;text-align:center;
 box-shadow:0 8px 30px #0001;
}
.logo{color:#c62828;font-size:35px;font-weight:bold;letter-spacing:2px}
.subtitle{color:#777;font-size:13px}
h1{color:#b51f2b;font-size:25px;margin-top:25px}
.gift{font-size:55px;margin:15px}
.info{background:#f9eeee;padding:15px;border-radius:12px;margin:20px 0;line-height:1.8}
label{display:block;text-align:left;margin:15px 0 6px;font-weight:bold}
input,textarea{
 width:100%;padding:14px;border:1px solid #ddd;
 border-radius:9px;font-size:16px;font-family:Arial,sans-serif;
}
textarea{min-height:120px;resize:vertical}
button{
 width:100%;padding:15px;margin-top:20px;border:0;
 border-radius:9px;background:#b51f2b;color:white;
 font-size:16px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.6}
.footer{font-size:12px;color:#888;margin-top:25px}
#mensaje,#mensajeLista{margin-top:15px;font-size:14px}
#resultado{
 display:none;margin-top:22px;padding:18px;
 background:#f9eeee;border-radius:12px;line-height:1.7;
}
#destinatario{font-size:23px;color:#b51f2b;font-weight:bold}
#seccionDeseos{
 display:none;margin-top:20px;padding:18px;
 background:#f7f7f7;border-radius:12px;text-align:left;
}
#seccionDeseos h3{text-align:center;color:#b51f2b}
#lista{margin-top:12px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">MENAVET</div>
 <div class="subtitle">COSTA RICA</div>

 <div class="gift">🎄🎁</div>

 <h1>Amigo Secreto 2026</h1>
 <p>¡La magia de regalar comienza aquí!</p>

 <div class="info">
  <strong>🎁 Regalo:</strong> ₡10.000<br>
  <strong>📅 Entrega:</strong> 18 de diciembre<br>
  <strong>👥 Participantes:</strong> 12
 </div>

 <h3>Ingreso de participantes</h3>

 <form id="formulario">
  <label for="nombre">Tu nombre</label>
  <input id="nombre" autocomplete="name"
   placeholder="Escribe tu nombre" required>

  <label for="pin">Tu PIN personal</label>
  <input id="pin" type="password" inputmode="numeric"
   autocomplete="current-password" placeholder="Ingresa tu PIN" required>

  <button id="boton" type="submit">INGRESAR</button>
 </form>

 <div id="mensaje" role="status"></div>

 <div id="resultado">
  <h3>🎁 ¡Tu amigo secreto es!</h3>
  <div id="destinatario"></div>

  <div id="lista"></div>

  <div id="seccionDeseos">
   <h3>📝 Mi lista de deseos</h3>
   <p>Escribe qué te gustaría recibir:</p>
   <textarea id="misDeseos" maxlength="1000"
    placeholder="Ejemplo: ropa, accesorios, libros, cosas que me gustan..."></textarea>
   <button id="guardar" type="button">GUARDAR MI LISTA</button>
   <div id="mensajeLista" role="status"></div>
  </div>
 </div>

 <div class="footer">
  Menavet Costa Rica · Amigo Secreto 2026
 </div>
</div>

<script>
const formulario = document.getElementById("formulario");
const boton = document.getElementById("boton");
const mensaje = document.getElementById("mensaje");
const resultado = document.getElementById("resultado");
const seccionDeseos = document.getElementById("seccionDeseos");
const guardar = document.getElementById("guardar");

let participanteActual = "";
let pinActual = "";

formulario.addEventListener("submit", async function(event){
 event.preventDefault();

 const nombre = document.getElementById("nombre").value.trim();
 const pin = document.getElementById("pin").value.trim();

 boton.disabled = true;
 boton.textContent = "CONSULTANDO...";
 mensaje.textContent = "";
 resultado.style.display = "none";
 seccionDeseos.style.display = "none";

 try{
  const respuesta = await fetch("/api/login", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name:nombre,pin:pin})
  });

  const datos = await respuesta.json();

  if(!respuesta.ok){
   throw new Error(datos.error || "No se pudo ingresar.");
  }

  participanteActual = nombre;
  pinActual = pin;

  document.getElementById("destinatario").textContent =
   datos.destinatario;

  const lista = document.getElementById("lista");
  lista.textContent = "";

  if(datos.lista_deseos){
   const titulo = document.createElement("h3");
   titulo.textContent = "🎄 Lo que le gustaría recibir";
   const contenido = document.createElement("p");
   contenido.textContent = datos.lista_deseos;
   lista.append(titulo,contenido);
  }else{
   lista.textContent = "Esta persona todavía no ha escrito su lista de deseos.";
  }

  document.getElementById("misDeseos").value = "";
  document.getElementById("mensajeLista").textContent = "";
  resultado.style.display = "block";
  seccionDeseos.style.display = "block";
  mensaje.textContent = "Ingreso correcto.";

 }catch(error){
  mensaje.textContent = error.message ||
   "Ocurrió un error. Intentá nuevamente.";
 }finally{
  boton.disabled = false;
  boton.textContent = "INGRESAR";
 }
});

guardar.addEventListener("click", async function(){
 const wishlist = document.getElementById("misDeseos").value.trim();
 const mensajeLista = document.getElementById("mensajeLista");

 if(!wishlist){
  mensajeLista.textContent = "Escribí algo antes de guardar.";
  return;
 }

 guardar.disabled = true;
 guardar.textContent = "GUARDANDO...";
 mensajeLista.textContent = "";

 try{
  const respuesta = await fetch("/api/guardar-lista", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name:participanteActual,
    pin:pinActual,
    wishlist:wishlist
   })
  });

  const datos = await respuesta.json();

  if(!respuesta.ok){
   throw new Error(datos.error || "No se pudo guardar la lista.");
  }

  mensajeLista.textContent = "¡Tu lista se guardó correctamente! 🎁";

 }catch(error){
  mensajeLista.textContent = error.message ||
   "Ocurrió un error al guardar.";
 }finally{
  guardar.disabled = false;
  guardar.textContent = "GUARDAR MI LISTA";
 }
});
</script>
</body>
</html>
